apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: helloworld
  labels:
    app: oom-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
